name: Test basic split with default separator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: split
        uses: .
        with:
          msg: "hello world foo"
      - name: Assert length
        env:
          ACTUAL: ${{ steps.split.outputs.length }}
        run: |
          echo "actual length: $ACTUAL"
          if [ "$ACTUAL" != "3" ]; then
            echo "FAIL: expected length '3', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert first element
        env:
          ACTUAL: ${{ steps.split.outputs._0 }}
        run: |
          echo "actual _0: $ACTUAL"
          if [ "$ACTUAL" != "hello" ]; then
            echo "FAIL: expected _0 'hello', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert second element
        env:
          ACTUAL: ${{ steps.split.outputs._1 }}
        run: |
          echo "actual _1: $ACTUAL"
          if [ "$ACTUAL" != "world" ]; then
            echo "FAIL: expected _1 'world', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert third element
        env:
          ACTUAL: ${{ steps.split.outputs._2 }}
        run: |
          echo "actual _2: $ACTUAL"
          if [ "$ACTUAL" != "foo" ]; then
            echo "FAIL: expected _2 'foo', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
