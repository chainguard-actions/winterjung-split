name: ci
on:
  - push

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-18.04
    steps:
      - uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de # v1
        with:
          python-version: 3.8
          architecture: x64

      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

  integration:
    runs-on: ubuntu-18.04
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Run split action
        id: split
        uses: ./
        with:
          msg: '/release split v1'

      - name: Test results
        env:
          SPLIT_0: ${{ steps.split.outputs._0 }}
          SPLIT_1: ${{ steps.split.outputs._1 }}
          SPLIT_2: ${{ steps.split.outputs._2 }}
          SPLIT_LENGTH: ${{ steps.split.outputs.length }}
        run: |
          [[ "$SPLIT_0" == "/release" ]] || exit 1
          [[ "$SPLIT_1" == "split" ]] || exit 1
          [[ "$SPLIT_2" == "v1" ]] || exit 1
          [[ "$SPLIT_LENGTH" == "3" ]] || exit 1
