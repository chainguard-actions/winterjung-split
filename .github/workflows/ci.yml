name: ci
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - v*

permissions: {}

jobs:
  build:
    runs-on: ubuntu-18.04
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Build
        run: docker build -t build-test .

  unit:
    runs-on: ubuntu-18.04
    steps:
      - uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de # v1
        with:
          python-version: 3.8
          architecture: x64

      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

  integration:
    runs-on: ubuntu-18.04
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Test local version
        id: local
        uses: ./
        with:
          msg: 'repo/name'
          separator: '/'

      - name: Test v2 version
        id: v2
        uses: jungwinter/split@a211a1c46e35fcdc4097d59dd6282d4a9859651b # v2
        with:
          msg: 'repo/name'
          separator: '/'

      - name: Test v1 version
        id: v1
        uses: jungwinter/split@c185fe95439c136a8788b7f700bd5275920d7109 # v1
        with:
          msg: 'repo/name'
          # v1 has misspelled sep'e'rator
          seperator: '/'

      - name: Test results
        env:
          LOCAL_0: ${{ steps.local.outputs._0 }}
          LOCAL_1: ${{ steps.local.outputs._1 }}
          LOCAL_LENGTH: ${{ steps.local.outputs.length }}
          V2_0: ${{ steps.v2.outputs._0 }}
          V2_1: ${{ steps.v2.outputs._1 }}
          V2_LENGTH: ${{ steps.v2.outputs.length }}
          V1_0: ${{ steps.v1.outputs._0 }}
          V1_1: ${{ steps.v1.outputs._1 }}
          V1_LENGTH: ${{ steps.v1.outputs.length }}
        run: |
          [[ "$LOCAL_0" == "repo" ]] || exit 1
          [[ "$LOCAL_1" == "name" ]] || exit 1
          [[ "$LOCAL_LENGTH" == "2" ]] || exit 1
          [[ "$V2_0" == "repo" ]] || exit 1
          [[ "$V2_1" == "name" ]] || exit 1
          [[ "$V2_LENGTH" == "2" ]] || exit 1
          [[ "$V1_0" == "repo" ]] || exit 1
          [[ "$V1_1" == "name" ]] || exit 1
          [[ "$V1_LENGTH" == "2" ]] || exit 1
